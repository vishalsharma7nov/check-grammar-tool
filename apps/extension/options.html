<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Check Grammar — Options</title>
    <style>
      :root {
        --ink: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
        --primary: #2563eb;
        --surface: #fff;
        --radius: 8px;
      }
      * { box-sizing: border-box; }
      body {
        font: 14px/1.5 system-ui, -apple-system, sans-serif;
        max-width: 520px;
        margin: 0 auto;
        padding: 24px 20px 32px;
        color: var(--ink);
      }
      h1 { font-size: 18px; margin: 0 0 4px; }
      .lead { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
      label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
      input[type="text"] {
        width: 100%;
        font: inherit;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        margin-bottom: 16px;
      }
      .toggle-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        margin-bottom: 16px;
      }
      .toggle-row input { margin-top: 3px; accent-color: var(--primary); }
      .toggle-row strong { display: block; font-size: 13px; }
      .toggle-row span { font-size: 12px; color: var(--muted); }
      button {
        font: inherit;
        font-weight: 600;
        padding: 8px 16px;
        border: 0;
        border-radius: var(--radius);
        background: var(--primary);
        color: #fff;
        cursor: pointer;
      }
      button:hover { filter: brightness(0.95); }
      #status { font-size: 12px; color: var(--muted); margin-top: 10px; min-height: 18px; }
      a { color: var(--primary); }
    </style>
  </head>
  <body>
    <h1>Check Grammar options</h1>
    <p class="lead">Privacy-first by default. Enhanced mode uses your local API — text never goes to Grammarly or our servers.</p>

    <label for="apiUrl">API URL</label>
    <input id="apiUrl" type="text" placeholder="http://127.0.0.1:8080" autocomplete="off" />

    <div class="toggle-row">
      <input id="enhancedMode" type="checkbox" />
      <div>
        <strong>Enhanced mode</strong>
        <span>Send checks to your local API (LanguageTool + optional Ollama). Requires <code>npm run dev:api</code> or shim.</span>
      </div>
    </div>

    <button type="button" id="save">Save settings</button>
    <p id="status" role="status"></p>

    <script src="options.js"></script>
  </body>
</html>
