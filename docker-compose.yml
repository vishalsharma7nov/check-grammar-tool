services:
  api:
    build:
      context: .
      dockerfile: server/api/Dockerfile
    ports: ["8080:8080"]
    environment:
      API_ADDR: ":8080"
      WEB_ORIGIN: "http://localhost:3000"
      CHECK_ENGINE_CLI: /app/server/shim/check-cli.mjs
      LLM_PROVIDER: local
      # Host LLM — not this container. On a Mac, Metal is on the host:
      LLM_BASE_URL: "http://host.docker.internal:8081/v1"
      JWT_SECRET: "dev-only-change-me"
      BILLING_ENABLED: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  web:
    build: ./apps/web
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
    depends_on: [api]
