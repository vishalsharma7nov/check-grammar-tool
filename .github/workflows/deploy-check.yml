# Validates API Docker build and engine tests before deploy.
# Does not deploy anywhere — use Render/Fly/Railway dashboards for that.

name: Deploy check

on:
  push:
    branches: [main, master]
    paths:
      - "server/**"
      - "packages/**"
      - "deploy/**"
      - "docker-compose.yml"
      - "package.json"
      - ".github/workflows/deploy-check.yml"
  pull_request:
    paths:
      - "server/**"
      - "packages/**"
      - "deploy/**"
      - "docker-compose.yml"
      - "package.json"
      - ".github/workflows/deploy-check.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Engine tests
        run: npm run test:engine

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/api/Dockerfile
          push: false
          tags: check-grammar-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test API container
        run: |
          docker run -d --name api-smoke -p 18080:8080 \
            -e WEB_ORIGIN=http://localhost:3000 \
            -e JWT_SECRET=ci-smoke-secret \
            check-grammar-api:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:18080/healthz >/dev/null; then
              curl -s http://localhost:18080/healthz | head -c 500
              exit 0
            fi
            sleep 1
          done
          docker logs api-smoke
          exit 1

      - name: Stop smoke container
        if: always()
        run: docker rm -f api-smoke 2>/dev/null || true
